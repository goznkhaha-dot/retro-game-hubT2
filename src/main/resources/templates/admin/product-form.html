<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm - Retro Game Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-center">Thêm Sản Phẩm Mới</h3>
            <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên Sản Phẩm</label>
                    <input type="text" th:field="*{name}" class="form-control" required placeholder="Ví dụ: Game Boy Color">
                </div>
                <div class="mb-3">
                    <label class="form-label">Danh Mục</label>
                    <input type="text" th:field="*{category}" class="form-control" required placeholder="Ví dụ: Handheld, Console, Băng Game">
                </div>
                <div class="mb-3">
                    <label class="form-label">Giá Bán (VNĐ)</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="1500000">
                </div>
                <div class="mb-3">
                    <label class="form-label">URL Hình Ảnh</label>
                    <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://link-anh.com/image.jpg">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô Tả</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Lưu Sản Phẩm</button>
                <a href="/admin/dashboard" class="btn btn-link text-secondary w-100 text-center mt-2">Hủy bỏ</a>
            </form>
        </div>
    </div>

</body>
</html>
