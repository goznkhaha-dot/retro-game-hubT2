<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Retro Game Hub - Thế Giới Game Cổ Điển</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-amber-500/30 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3 text-2xl font-black tracking-wider text-amber-400 uppercase">
                <i class="fa-solid fa-[#f59e0b] fa-gamepad text-3xl"></i>
                RETRO GAME HUB
            </a>
            <div class="flex items-center gap-4">
                <a href="/orders/my-orders" class="px-4 py-2 text-sm font-semibold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500 hover:text-slate-900 transition-all duration-200">
                    <i class="fa-solid fa-receipt mr-1"></i> Đơn hàng của tôi
                </a>
            </div>
        </div>
    </header>

    <!-- Banner Section -->
    <section class="py-12 bg-gradient-to-b from-slate-800 to-slate-900 text-center border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4">
            <span class="text-xs uppercase font-bold tracking-widest text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">
                Phiên Bản Sưu Tầm Độc Quyền
            </span>
            <h1 class="text-4xl md:text-5xl font-black mt-4 mb-3 tracking-tight text-white">
                SỐNG LẠI KÝ ỨC GAME RETRO
            </h1>
            <p class="text-slate-400 text-base">Sở hữu những cỗ máy chơi game huyền thoại cùng trải nghiệm chân thực nhất.</p>
        </div>
    </section>

    <!-- Product Display Section -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-8 text-amber-400 flex items-center gap-2">
            <i class="fa-solid fa-fire text-amber-500"></i> Sản Phẩm Nổi Bật
        </h2>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div th:each="product : ${products}" class="bg-slate-800/80 rounded-xl overflow-hidden border border-slate-700/60 hover:border-amber-500/50 transition-all duration-300 shadow-xl flex flex-col group">
                
                <!-- Image Container -->
                <div class="relative h-48 overflow-hidden bg-slate-950">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                </div>

                <!-- Product Content -->
                <div class="p-5 flex flex-col flex-grow">
                    <h3 th:text="${product.name}" class="font-bold text-lg text-white mb-2 line-clamp-1">Tên sản phẩm</h3>
                    <p th:text="${product.description}" class="text-slate-400 text-sm mb-4 line-clamp-2 flex-grow">Mô tả sản phẩm</p>
                    
                    <div class="pt-3 border-t border-slate-700/50 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-slate-400 block">Giá bán</span>
                            <span class="text-lg font-black text-amber-400" 
                                  th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </span>
                        </div>
                        <button class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition-colors duration-200">
                            Xem thêm
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
