<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Retro Game Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2e;
            --accent-yellow: #ffb703;
            --accent-orange: #fb8500;
            --accent-cyan: #00f5d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(114, 9, 183, 0.25), transparent 70%),
                        linear-gradient(180deg, #070a12 0%, var(--bg-dark) 100%);
            padding: 20px 0;
        }

        .login-card {
            background: rgba(21, 28, 46, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(255, 183, 3, 0.1);
            position: relative;
        }

        .brand-logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--accent-yellow);
            text-shadow: 0 0 12px rgba(255, 183, 3, 0.5);
            text-align: center;
            margin-bottom: 25px;
            display: block;
            text-decoration: none;
        }

        .form-control {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(11, 15, 25, 0.95);
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.25);
            color: #fff;
        }

        .input-icon-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .form-control:focus + i {
            color: var(--accent-yellow);
        }

        .btn-neon-glow {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
            color: #0b0f19;
            font-weight: 800;
            padding: 12px;
            border-radius: 12px;
            border: none;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
        }

        .btn-neon-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 183, 3, 0.6);
            color: #0b0f19;
        }

        .back-home-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-home-link:hover {
            color: var(--accent-cyan);
            transform: translateX(-3px);
        }

        .alert-custom {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/" class="brand-logo">
            <i class="fa-solid fa-gamepad me-2"></i>RETRO GAME HUB
        </a>

        <h4 class="fw-bold text-center mb-1">Đăng Nhập Tài Khoản</h4>
        <p class="text-muted text-center small mb-4">Nhập thông tin để tiếp tục trải nghiệm mua sắm</p>

        <!-- Thông báo lỗi đăng nhập từ Spring Security -->
        <div th:if="${param.error}" class="alert alert-custom p-3 mb-4">
            <i class="fa-solid fa-circle-exclamation me-1"></i> Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>

        <div th:if="${param.logout}" class="alert alert-success bg-opacity-10 border-success text-success p-3 mb-4 rounded-3 small">
            <i class="fa-solid fa-circle-check me-1"></i> Đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="input-icon-wrapper">
                <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required autofocus>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-icon-wrapper">
                <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <button type="submit" class="btn btn-neon-glow mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>ĐĂNG NHẬP
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <a href="/" class="back-home-link">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
            </a>
        </div>
    </div>

</body>
</html>
