<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - Retro Game Hub'">Chi tiết sản phẩm</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2e;
            --accent-yellow: #ffb703;
            --accent-orange: #fb8500;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .custom-navbar {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.85rem;
            color: var(--accent-yellow) !important;
        }

        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
        }

        .product-img {
            width: 100%;
            border-radius: 16px;
            object-fit: cover;
            max-height: 400px;
        }

        .price-tag {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-yellow);
        }

        .btn-buy {
            background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
            color: #0b0f19;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 183, 3, 0.4);
            color: #0b0f19;
        }

        .btn-back {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 10px;
            padding: 8px 16px;
            text-decoration: none;
        }

        .btn-back:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-gamepad text-warning fs-5"></i> RETRO GAME HUB
            </a>
            <a href="/" class="btn-back btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="detail-card">
            <div class="row g-4 align-items-center">
                <div class="col-md-6">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'}" 
                         th:alt="${product.name}" class="product-img">
                </div>
                <div class="col-md-6">
                    <span class="badge bg-secondary mb-2" th:text="${product.category != null ? product.category : 'Retro'}">Console</span>
                    <h2 class="fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h2>
                    <p class="text-muted mb-4" th:text="${product.description}">Mô tả chi tiết sản phẩm...</p>
                    
                    <div class="mb-4">
                        <span class="text-muted d-block small">Giá bán:</span>
                        <span class="price-tag" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                    </div>

                    <form th:action="@{/orders/create}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <label for="quantity" class="form-label mb-0 text-muted">Số lượng:</label>
                            <input type="number" id="quantity" name="quantity" value="1" min="1" max="10" class="form-control text-center bg-dark text-white border-secondary" style="width: 80px;">
                        </div>
                        <button type="submit" class="btn btn-buy w-100">
                            <i class="fa-solid fa-cart-shopping me-2"></i> Mua Ngay
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
